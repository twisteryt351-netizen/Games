name: Robo de Jogos - Trapacas e Macetes

on:
  schedule:
    - cron: '0 19 * * *'   # 19:00 UTC = 16:00 Brasilia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests groq google-api-python-client google-auth-oauthlib google-auth
      - run: python jogos_trapacas.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLOGGER_ID_GAMES: ${{ secrets.BLOGGER_ID_GAMES }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}  # opcional
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
      - name: Salvar historico
        run: |
          git config user.name "Robo de Jogos"
          git config user.email "robo@exemplo.com"
          git add historico_jogos_trapacas.txt || true
          git commit -m "Atualiza historico" || echo "Nada novo para commitar."
          git push || (echo "::error::git push falhou - o historico NAO foi salvo. Confira as permissoes do GITHUB_TOKEN (contents: write)." && exit 1)
